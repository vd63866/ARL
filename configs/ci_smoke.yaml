# Lightweight configuration for the CI end-to-end smoke test (tests/test_e2e_smoke.py).
# It exercises the full train -> checkpoint -> reload -> evaluate -> demo lifecycle on a
# tiny budget. It is NOT tuned for policy quality; see configs/drone_ppo_demo.yaml for that.
name: "ci_smoke"
seed: 42

algorithm:
  name: "ppo"
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 64
  parameters:
    n_steps: 128
    n_epochs: 2
    clip_range: 0.2
    ent_coef: 0.0

environment:
  name: "drone"
  max_steps: 100
  parameters:
    bounds: [15.0, 15.0, 8.0]
    start_pos: [3.0, 3.0, 3.0]
    goal_pos: [12.0, 12.0, 5.0]
    num_obstacles: 1
    obstacle_radius: 1.5
    target_radius: 1.5
    collision_radius: 0.8
    max_steps: 100

training:
  total_timesteps: 512
  checkpoint_freq: 256
  log_interval: 10

evaluation:
  eval_episodes: 5
  deterministic: true

output_dir: "artifacts/ci_smoke"
log_dir: "artifacts/ci_smoke/logs"
